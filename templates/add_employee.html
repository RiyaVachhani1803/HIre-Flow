{% extends "base.html" %}
{% block content %}

<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h2>Add Employee</h2>
        <p class="text-muted">Fill in the details to add a new employee</p>
    </div>
    <a href="/hr/employees/" class="btn btn-outline-secondary btn-sm">
        <i class="fa fa-arrow-left me-1"></i> Back
    </a>
</div>

<div class="card-clean" style="max-width:600px;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">
            <i class="fa fa-user-plus me-2"></i>Add Employee
        </button>
    </form>
</div>

{% endblock %}
