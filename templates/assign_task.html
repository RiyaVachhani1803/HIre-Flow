{% extends "base.html" %}
{% block content %}

<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h2>Assign Task</h2>
        <p class="text-muted">Assign onboarding tasks to employees</p>
    </div>
    <a href="/hr/dashboard/" class="btn btn-outline-secondary btn-sm">
        <i class="fa fa-arrow-left me-1"></i> Back
    </a>
</div>

<div class="card-clean" style="max-width:600px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">
            <i class="fa fa-check me-2"></i>Assign Task
        </button>
    </form>
</div>

{% endblock %}
