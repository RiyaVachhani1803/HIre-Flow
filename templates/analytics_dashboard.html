{% extends "base.html" %}
{% block content %}

<div class="page-header">
    <h2>Analytics Dashboard</h2>
    <p class="text-muted">Overview of HR statistics</p>
</div>

<!-- Stat Cards -->
<div class="row g-4 mb-4">
    <div class="col-md-4">
        <div class="stat-card">
            <div class="stat-icon" style="background:#4e8cff;">
                <i class="fa fa-users"></i>
            </div>
            <div class="stat-info">
                <h3>{{ total_employees }}</h3>
                <p>Total Employees</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="stat-card">
            <div class="stat-icon" style="background:#38a169;">
                <i class="fa fa-file-circle-check"></i>
            </div>
            <div class="stat-info">
                <h3>{{ verified_docs }}</h3>
                <p>Verified Documents</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="stat-card">
            <div class="stat-icon" style="background:#e53e3e;">
                <i class="fa fa-clock"></i>
            </div>
            <div class="stat-info">
                <h3>{{ pending_docs }}</h3>
                <p>Pending Documents</p>
            </div>
        </div>
    </div>
</div>

<!-- Charts -->
<div class="row g-4">
    <div class="col-md-7">
        <div class="card-clean">
            <h5 class="mb-4">Employees per Department</h5>
            <canvas id="deptChart" height="120"></canvas>
        </div>
    </div>
    <div class="col-md-5">
        <div class="card-clean">
            <h5 class="mb-4">Document Status</h5>
            <canvas id="docChart"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Department Bar Chart
    new Chart(document.getElementById('deptChart'), {
        type: 'bar',
        data: {
            labels: {{ departments|safe }},
            datasets: [{
                label: 'Employees',
                data: {{ counts|safe }},
                backgroundColor: '#4e8cff',
                borderRadius: 6,
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
    });

    // Document Pie Chart
    new Chart(document.getElementById('docChart'), {
        type: 'doughnut',
        data: {
            labels: ['Verified', 'Pending'],
            datasets: [{
                data: [{{ verified_docs }}, {{ pending_docs }}],
                backgroundColor: ['#38a169', '#e53e3e'],
                borderWidth: 0,
            }]
        },
        options: {
            plugins: {
                legend: { position: 'bottom' }
            },
            cutout: '65%',
        }
    });
</script>

{% endblock %}
