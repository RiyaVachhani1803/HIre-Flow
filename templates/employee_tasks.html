<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Tasks - HireFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .topbar {
            background: #1a1f2e;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar .brand { font-size: 20px; font-weight: 700; }
        .topbar .brand span { color: #4e8cff; }
        .main { padding: 30px; }
        .task-card {
            background: white;
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #4e8cff;
        }
        .task-card.done { border-left-color: #38a169; opacity: 0.75; }
        .task-title { font-weight: 700; margin: 0; }
        .task-desc { color: #718096; font-size: 13px; margin: 4px 0 0; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="brand">HireFlow</div>
    <a href="/employee/dashboard/" class="btn btn-sm btn-outline-light">
        <i class="fa fa-arrow-left me-1"></i>Dashboard
    </a>
</div>

<div class="main">
    <h4 class="fw-bold mb-4">My Tasks</h4>

    {% for task in tasks %}
    <div class="task-card {% if task.completed %}done{% endif %}">
        <div>
            <p class="task-title">{{ task.title }}</p>
            <p class="task-desc">{{ task.description }}</p>
        </div>
        <div class="text-end">
            {% if task.completed %}
                <span class="badge bg-success">
                    <i class="fa fa-check me-1"></i>Completed
                </span>
            {% else %}
                <a href="/employee/complete-task/{{ task.id }}/"
                   class="btn btn-sm btn-success">
                    <i class="fa fa-check me-1"></i>Mark Complete
                </a>
            {% endif %}
        </div>
    </div>
    {% empty %}
        <div class="text-center text-muted py-5">
            <i class="fa fa-clipboard fa-3x mb-3"></i>
            <p>No tasks assigned yet.</p>
        </div>
    {% endfor %}
</div>

</body>
</html>
