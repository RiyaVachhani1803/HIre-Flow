<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HireFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1f2e, #2d3446);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand { font-size: 32px; font-weight: 800; color: #1a1f2e; }
        .subtitle { color: #718096; margin-bottom: 35px; }
        .btn-hr {
            background: #4e8cff;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            width: 100%;
            margin-bottom: 12px;
            text-decoration: none;
            display: block;
            transition: 0.2s;
        }
        .btn-hr:hover { background: #3a7bd5; color: white; }
        .btn-emp {
            background: #38a169;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            width: 100%;
            text-decoration: none;
            display: block;
            transition: 0.2s;
        }
        .btn-emp:hover { background: #2f855a; color: white; }
        .divider { margin: 25px 0; color: #a0aec0; font-size: 13px; }
    </style>
</head>
<body>
<div class="home-card">
    <div class="brand">HireFlow</div>
    <p class="subtitle mt-2">Smart Employee Onboarding System</p>

    <a href="/login/hr/" class="btn-hr">
        <i class="fa fa-shield-halved me-2"></i> Login as HR
    </a>
    <a href="/login/employee/" class="btn-emp">
        <i class="fa fa-user me-2"></i> Login as Employee
    </a>

    <div class="divider">─── or ───</div>
    <a href="/signup/" style="color:#4e8cff; font-size:14px;">
        Don't have an account? <br><strong>Sign Up</strong>
    </a>
</div>
</body>
</html>
