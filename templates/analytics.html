{% extends "base.html" %}
{% block content %}

<!DOCTYPE html>
<html>

    <head>
        <title>Analytics</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>

    <body>

        <div class="container mt-4">
            <h2>HR Analytics Dashboard</h2>

            <div class="row">
                <div class="col-md-3">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <h4>{{ total_employees }}</h4>
                            <p>Total Employees</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card bg-success text-white">
                        <div class="card-body">
                            <h4>{{ total_documents }}</h4>
                            <p>Total Documents</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card bg-info text-white">
                        <div class="card-body">
                            <h4>{{ verified_documents }}</h4>
                            <p>Verified Documents</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card bg-danger text-white">
                        <div class="card-body">
                            <h4>{{ pending_documents }}</h4>
                            <p>Pending Documents</p>
                        </div>
                    </div>
                </div>

            </div>

            <br>

            <canvas id="docChart"></canvas>

        </div>

        <script>

            const ctx = document.getElementById('docChart');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Verified', 'Pending'],
                    datasets: [{
                        data: [{{ verified_documents }}, {{ pending_documents }}],
                        backgroundColor: ['green', 'red']
                    }]
                }
            });
        </script>

    </body>

</html>

{% endblock %}
