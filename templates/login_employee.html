<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Login - HireFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1f2e, #2d3446);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand { font-size: 26px; font-weight: 800; color: #1a1f2e; text-align: center; }
        .brand span { color: #38a169; }
        .icon-circle {
            width: 70px; height: 70px;
            background: #38a169;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px;
            font-size: 28px; color: white;
        }
        .form-group { position: relative; margin-bottom: 16px; }
        .form-group i {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }
        .form-control {
            padding-left: 40px;
            border-radius: 10px;
            height: 48px;
            border: 1px solid #e2e8f0;
        }
        .form-control:focus {
            border-color: #38a169;
            box-shadow: 0 0 0 3px rgba(56,161,105,0.15);
        }
        .btn-login {
            background: #38a169;
            border: none;
            border-radius: 10px;
            height: 48px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            color: white;
            margin-top: 5px;
        }
        .btn-login:hover { background: #2f855a; color: white; }

        .forgot-link {
            text-align: right;
            margin-bottom: 10px;
            margin-top: -8px;
        }
        .forgot-link a {
            font-size: 13px;
            color: #38a169;
            text-decoration: none;
        }
        .forgot-link a:hover { text-decoration: underline; }

        .bottom-links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #718096;
        }
        .bottom-links a { color: #38a169; text-decoration: none; }
        .divider {
            border-top: 1px solid #e2e8f0;
            margin: 20px 0 15px;
        }
    </style>
</head>
<body>
<div class="login-card">

    <div class="icon-circle">
        <i class="fa fa-user"></i>
    </div>

    <div class="brand">HireFlow</div>
    <p class="text-center text-muted mb-4" style="font-size:13px;">Employee Portal</p>

    {% if messages %}
        {% for message in messages %}
        {% if message.tags == 'error' or message.tags == 'warning' %}
        <div class="alert alert-danger py-2">{{ message }}</div>
        {% endif %}
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login_employee' %}" autocomplete="off">
        {% csrf_token %}
        <!-- Dummy inputs to absorb browser autofill -->
        <input type="text" name="prevent_autofill_username" style="display:none;" />
        <input type="password" name="prevent_autofill_password" style="display:none;" />

        <div class="form-group">
            <i class="fa fa-envelope"></i>
            <input type="text" name="username" class="form-control"
                   placeholder="Email or Username" autocomplete="off" required>
        </div>

        <div class="form-group">
            <i class="fa fa-lock"></i>
            <input type="password" name="password" class="form-control"
                   placeholder="Password" autocomplete="new-password" required>
        </div>

        <!-- Forgot Password / ID link -->
        <div class="forgot-link">
            <a href="/forgot-id/">
                <i class="fa fa-key me-1"></i>Forgot Password or ID?
            </a>
        </div>

        <div class="form-group">
            <i class="fa fa-id-card"></i>
            <input type="text" name="employee_id" class="form-control"
                   placeholder="Employee ID" autocomplete="off" required>
        </div>

        <button type="submit" class="btn-login">
            <i class="fa fa-sign-in-alt me-2"></i> Sign In
        </button>

    </form>

    <div class="divider"></div>

    <div class="bottom-links">
        <p class="mb-1">Don't have an account? <a href="/signup/">Sign Up</a></p>
        <a href="/">← Back to Home</a>
    </div>

</div>
</body>
</html>
