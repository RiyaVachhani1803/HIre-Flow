<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - HireFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1f2e, #2d3446);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .icon-circle {
            width: 70px; height: 70px;
            background: #4e8cff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px; color: white;
        }
        .form-control {
            border-radius: 10px;
            height: 48px;
            border: 1px solid #e2e8f0;
            text-align: left;
            padding-left: 15px;
        }
        .form-control:focus {
            border-color: #4e8cff;
            box-shadow: 0 0 0 3px rgba(78,140,255,0.15);
        }
        .btn-reset {
            background: #4e8cff;
            color: white;
            border: none;
            border-radius: 10px;
            height: 48px;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
            margin-top: 5px;
        }
        .btn-reset:hover { background: #3a7bd5; color: white; }
        .success-box {
            background: #f0fff4;
            border: 1px solid #38a169;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="card-box">

    <div class="icon-circle">
        <i class="fa fa-key"></i>
    </div>

    <h4 style="font-weight:700;">Forgot Password?</h4>
    <p class="text-muted mb-4" style="font-size:13px;">
        Enter your email and we'll send you reset instructions.
    </p>

    {% if sent %}
    <div class="success-box" style="margin-top: 15px;">
        <i class="fa fa-circle-check text-success fa-2x mb-2"></i>
        <p class="text-success fw-bold mb-1">Email Sent!</p>
        <p class="text-muted small mb-0">
            If this email is registered, you'll receive reset instructions shortly.
        </p>
    </div>
    {% else %}
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3 text-start">
            <label class="form-label fw-semibold" style="font-size:13px;">Email Address</label>
            <input type="email" name="email" class="form-control"
                   placeholder="Enter your email" required>
        </div>
        <button type="submit" class="btn-reset">
            <i class="fa fa-paper-plane me-2"></i>Send Reset Link
        </button>
    </form>
    {% endif %}

    <div class="mt-4" style="font-size:13px;">
        <a href="/" style="color:#4e8cff; text-decoration:none;">
            <i class="fa fa-arrow-left me-1"></i>Back to Home
        </a>
    </div>

</div>
</body>
</html>
