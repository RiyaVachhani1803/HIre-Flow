<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Created - HireFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1f2e, #2d3446);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success-card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            width: 440px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .check-circle {
            width: 80px; height: 80px;
            background: #38a169;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px; color: white;
        }
        .brand { font-size: 22px; font-weight: 800; color: #1a1f2e; }
        .brand span { color: #4e8cff; }
        .id-box {
            background: #f0f7ff;
            border: 2px dashed #4e8cff;
            border-radius: 14px;
            padding: 18px;
            margin: 20px 0;
        }
        .id-box p { color: #718096; font-size: 13px; margin: 0 0 6px; }
        .id-box .id-value {
            font-size: 26px;
            font-weight: 800;
            color: #4e8cff;
            letter-spacing: 3px;
        }
        .warning-box {
            background: #fffbeb;
            border: 1px solid #f6e05e;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #744210;
            margin-bottom: 20px;
        }
        .btn-login {
            background: #4e8cff; color: white;
            border: none; border-radius: 10px;
            height: 46px; width: 100%;
            font-size: 15px; font-weight: 600;
            text-decoration: none; display: block;
            line-height: 46px; margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn-login:hover { background: #3a7bd5; color: white; }
        .btn-home {
            background: #f1f5f9; color: #1a1f2e;
            border: none; border-radius: 10px;
            height: 46px; width: 100%;
            font-size: 15px; font-weight: 600;
            text-decoration: none; display: block;
            line-height: 46px;
        }
        .btn-home:hover { background: #e2e8f0; color: #1a1f2e; }
    </style>
</head>
<body>
<div class="success-card">

    <div class="check-circle">
        <i class="fa fa-check"></i>
    </div>

    <div class="brand">HireFlow</div>
    <h4 style="font-weight:700; margin: 12px 0 4px;">Account Created!</h4>
    <p class="text-muted" style="font-size:14px;">
        Your account has been successfully created.
    </p>

    <div class="id-box">
        <p>Your Employee ID is</p>
        <div class="id-value">{{ employee_id }}</div>
    </div>

    <div class="warning-box">
        <i class="fa fa-triangle-exclamation me-2"></i>
        <strong>Save this ID!</strong> You will need it every time you log in.
    </div>

    {% if employee_id and employee_id|slice:":1" == "H" %}
      <a href="/login/hr/" class="btn-login">
          <i class="fa fa-sign-in-alt me-2"></i>Go to Login
      </a>
    {% else %}
      <a href="/login/employee/" class="btn-login">
          <i class="fa fa-sign-in-alt me-2"></i>Go to Login
      </a>
    {% endif %}
    <a href="/" class="btn-home">
        <i class="fa fa-house me-2"></i>Back to Home
    </a>

</div>
</body>
</html>
